details{border-bottom:1px solid var(--bd);padding:12px 0}summary{cursor:pointer;font-weight:600}details p{color:var(--mu);margin-top:8px}body{overflow-x:hidden}.serif,.lp h1,.lp h2{font-family:Fraunces,Georgia,'Times New Roman',serif}.lp h1,.lp h2{font-weight:600;letter-spacing:-.025em}.lp h1{font-size:clamp(2.4rem,5.2vw,3.9rem);line-height:1.05}.lp h2{font-size:clamp(1.8rem,3.4vw,2.7rem);line-height:1.1}.lp em{font-style:italic;color:var(--ac)}.lp .sp{padding:84px 0}.lp .hero2{display:grid;grid-template-columns:1fr;max-width:780px;padding:72px 0 80px}.lp .lead{font-size:1.1rem;color:var(--mu);max-width:520px;margin:22px 0 28px}.ctas{display:flex;gap:10px;flex-wrap:wrap}.ctas .btn{padding:14px 20px;font-size:14.5px}

.mock{background:var(--card);border:1px solid var(--bd);border-radius:16px;box-shadow:0 28px 60px -30px rgba(15,61,42,.5);overflow:hidden}.bar2{display:flex;gap:6px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--bd)}.bar2 i{width:9px;height:9px;border-radius:50%;background:var(--bd)}.mock .bd{padding:20px 20px 40px}.q2{border-left:3px solid var(--ac);padding:2px 0 2px 12px;margin-top:16px;font-size:14px}.q2 span{display:block;color:var(--mu);font-size:12px;margin-top:4px}.chip2{position:absolute;left:-18px;bottom:-20px;background:var(--ac);color:#fff;padding:11px 16px;border-radius:12px;font-size:13px;font-weight:600;box-shadow:0 12px 28px -12px rgba(15,61,42,.6)}

.faq details{padding:0;border-bottom:1px solid var(--bd)}.faq summary{list-style:none;display:flex;justify-content:space-between;gap:12px;padding:18px 0;font-weight:600}.faq summary::-webkit-details-marker{display:none}.faq summary::after{content:'+';font-size:1.3rem;font-weight:400;color:var(--ac)}.faq details[open] summary::after{content:'–'}.faq details p{padding:0 0 18px;margin:0}
@media(max-width:820px){.lp .hero2,.split{grid-template-columns:1fr;gap:32px}.lp .sp{padding:56px 0}.jr{grid-template-columns:1fr 1fr;gap:28px 0}.chip2{left:12px}.ctas .btn{width:100%}}

footer{text-align:center;color:var(--mu);font-size:13px;padding:30px}footer a{cursor:pointer;text-decoration:underline;margin:0 8px}

<script>
const S={view:'home',role:'',cur:null,cm:'new',qs:[{q:'',h:'',t:'text',r:1}],comm:20,me:'',user:null,pre:'',next:'',msg:'',err:'',f:{},users:[{n:'Demo Founder',e:'founder@demo.com',p:'demo1234',r:'f'},{n:'Demo Contributor',e:'user@demo.com',p:'demo1234',r:'c'},{n:'Admin',e:'admin@demo.com',p:'admin1234',r:'a'}],
my:{},
c:[{id:1,own:1,t:'Test my SaaS onboarding flow',cat:'Website testing',d:'Sign up, explore the dashboard and tell us where you got stuck.',goal:'Find out where new users get stuck so we can fix onboarding before launch.',steps:['Open the demo link and create a test account','Complete the first-time setup','Explore the dashboard for about 5 minutes'],link:'https://example.com/demo',q:[{q:'Where did you hesitate or feel confused?',h:'Name the exact screen or step.',t:'text',r:1},{q:'How easy was signing up?',h:'1 = very hard, 5 = very easy',t:'rating',r:1},{q:'Would you use this product?',h:'',t:'yesno',r:1},{q:'What would you change first?',h:'One or two sentences is fine.',t:'text',r:0}],rw:60,min:10,need:10,dl:'2026-12-05',aud:'Small-business owners'},
{id:2,own:1,t:'Logo and branding review',cat:'Branding',d:'Look at three logo options for a baby clothing brand.',q:['Which logo is strongest?','What feeling does it give?'],rw:40,min:5,need:8,dl:'2026-11-28',aud:'Parents'},
{id:3,own:0,t:'Pricing page clarity check',cat:'Pricing',d:'Read a SaaS pricing page and tell us if the plans are clear.',q:['Are the plans clear?','Which plan would you pick and why?'],rw:50,min:7,need:12,dl:'2026-12-12',aud:'Freelancers'},
{id:4,own:0,t:'Short interview: online shopping habits',cat:'Interview',d:'A 15 minute written chat about how you shop for clothes online.',q:['How do you discover new brands?','What makes you abandon a cart?'],rw:150,min:15,need:5,dl:'2026-12-20',aud:'Online shoppers'},
{id:5,own:0,t:'Mobile app first impressions',cat:'App feedback',d:'Open a fitness app prototype and share your first impressions.',q:['What is this app for?','What confused you?'],rw:80,min:12,need:10,dl:'2026-12-08',aud:'Anyone 18+'},
{id:6,own:0,t:'Business idea review: meal-prep subscription',cat:'Idea validation',d:'Read a one-page idea and give honest thoughts.',q:['Would you try it?','What is missing?'],rw:70,min:8,need:10,dl:'2026-12-15',aud:'Working professionals'}],
s:[{id:1,cid:1,who:'Aarav S.',a:['Pricing link was hidden in the footer.','Make step one shorter.','Yes, with a free trial.'],st:'Approved',rv:'Admin Riya',at:'3 Nov'},
{id:2,cid:1,who:'Meera K.',a:['Signup email was slow.','Add social login.','Maybe.'],st:'Approved',rv:'Admin Riya',at:'4 Nov'},
{id:3,cid:2,who:'Dev P.',a:['Logo B','Warm and friendly'],st:'Approved',rv:'Admin Karan',at:'1 Nov'},
{id:4,cid:1,who:'Isha T.',a:['It was fine.','Nothing.','Not sure.'],st:'Pending Review',rv:'',at:''}]};
const $=x=>document.querySelector(x),inr=n=>'₹'+Math.round(n).toLocaleString('en-IN');
const cam=id=>S.c.find(c=>c.id==id),appr=id=>S.s.filter(s=>s.cid==id&&s.st=='Approved');
const mine=()=>S.s.filter(s=>s.who==S.me&&!s.arch);
const earn=()=>mine().filter(s=>s.st=='Approved').reduce((n,s)=>n+cam(s.cid).rw,0);
const pill=s=>`<span class="pill ${s=='Approved'?'ok':s=='Rejected'?'er':s=='Pending Review'?'wn':''}">${s=='Approved'?'Approved · Reward credited':s}</span>`;
function go(v,c){S.view=v;if(c)S.cur=c;if(['founder','create','campaign'].includes(v))S.role='f';if(['contributor','task'].includes(v))S.role='c';if(v=='admin')S.role='a';location.hash=v;draw();scrollTo(0,0)}
function nav(){const L={'':[],f:[['founder','Dashboard'],['create','New campaign'],['fwallet','Wallet']],c:[['contributor','Tasks'],['wallet','Wallet'],['profile','Profile']],a:[['admin','Review queue']]}[S.role]||[];
$('#nav').innerHTML=`<span class="logo" onclick="S.role='';go('home')">Loop<b>back</b></span>${L.map(([v,t])=>`<a class="${S.view==v?'on':''}" onclick="go('${v}')">${t}</a>`).join('')}${S.role?`<a onclick="S.role='';go('home')">Exit</a>`:'<a onclick="go(\'privacy\')">Privacy</a>'}`}
const V={
home:()=>`<div class="hero"><span class="pill">Honest feedback. Real people. Reviewed by humans.</span><h1 style="margin-top:18px">Where founders get real feedback and contributors get rewarded for giving it.</h1><p>Loopback is a marketplace with two sides: founders who want honest opinions on their ideas and products, and everyday people who earn rewards by giving thoughtful feedback.</p>
<button class="btn" onclick="go('contributor')">I’m here to earn by giving feedback</button><button class="btn g" onclick="go('founder')">I’m here to get feedback</button></div>
<div class="sec"><h2>Who is Loopback for?</h2><p class="mu">Two kinds of people, one shared goal: better products built on honest input.</p><div class="grid g2">
<div class="card stack"><span class="pill">Founders & business owners</span><h3>Stop guessing. Ask real people.</h3><p class="mu">Test your website, app, idea, branding or pricing. Get honest, useful answers from the audience you want to reach.</p></div>
<div class="card stack"><span class="pill ok">Contributors</span><h3>Your opinion has value.</h3><p class="mu">Share thoughtful feedback on products and ideas you find interesting, and earn rewards for answers that are genuinely helpful.</p></div></div></div>
<div class="sec"><h2>How contributors earn</h2><p class="mu">Simple, fair and transparent.</p><div class="grid g4">${[['Create a profile','Tell us a bit about your interests and background so we can show you relevant tasks.'],['Pick a task','Browse new tasks, filter them, read the details, then do it now or save it for later.'],['Give honest feedback','Complete the task and answer the founder’s questions with care and detail.'],['Get rewarded','Our team reviews your answers. Once approved, your reward is credited to you.']].map((x,i)=>`<div class="card"><span class="num">${i+1}</span><h3 style="margin-bottom:6px">${x[0]}</h3><p class="mu">${x[1]}</p></div>`).join('')}</div></div>
<div class="sec"><h2>How founders get feedback</h2><p class="mu">From question to insight in a few steps.</p><div class="grid g4">${[['Set up your profile','Tell us about your business so contributors understand the context.'],['Add a feedback task','Explain what you want tested or reviewed, choose your audience and add your own questions.'],['Reviewed responses arrive','Every response is checked by our team for quality, relevance and authenticity first.'],['Learn and improve','See approved feedback, track progress and keep a record of every past campaign.']].map((x,i)=>`<div class="card"><span class="num">${i+1}</span><h3 style="margin-bottom:6px">${x[0]}</h3><p class="mu">${x[1]}</p></div>`).join('')}</div></div>
<div class="sec"><h2>Safe and trustworthy by design</h2><p class="mu">Both sides are protected, because good feedback needs trust.</p><div class="grid g3">${[['Every response is reviewed','Spam, fake and incomplete answers are filtered out before founders ever see them.'],['Fair for contributors','Clear status updates, clear rejection reasons and a way to appeal.'],['Your privacy comes first','We never sell your data. Founders see only what is needed to understand your feedback.'],['Rewards only for real value','Approved feedback earns rewards, so quality is always rewarded.'],['Transparent decisions','Each review records who checked it and when.'],['You stay in control','Request deletion of your data at any time.']].map(x=>`<div class="card"><h3 style="margin-bottom:6px">${x[0]}</h3><p class="mu">${x[1]}</p></div>`).join('')}</div><p style="margin-top:18px"><a onclick="go('privacy')" style="cursor:pointer;color:var(--ac);font-weight:600">Read our privacy policy →</a></p></div>
<div class="hero" style="padding-bottom:0"><h2>Ready to get started?</h2><p style="margin-top:10px;margin-bottom:18px">Choose how you want to use Loopback.</p><button class="btn" onclick="go('contributor')">I’m here to earn by giving feedback</button><button class="btn g" onclick="go('founder')">I’m here to get feedback</button></div>`,
privacy:()=>`<div class="pol" style="max-width:720px"><h2>Privacy policy</h2><p>Last updated: November 2026. This is a plain-language summary; have it reviewed legally before launch.</p>
<h3>What we collect</h3><p>Account details, profile information you choose to share (age group, location, interests, professional background), the feedback you submit, and basic usage data.</p>
<h3>How we use it</h3><p>To match contributors with relevant tasks, review submissions for quality and authenticity, process rewards, prevent fraud and improve the service.</p>
<h3>What founders can see</h3><p>Founders see only approved feedback and limited, non-sensitive contributor information such as first name and general background. Contact details are never shared.</p>
<h3>What we never do</h3><ul><li>We never sell personal data.</li><li>We never share rejected or unreviewed submissions with founders.</li><li>We never ask for your password outside the login page.</li></ul>
<h3>Founder content</h3><p>Campaign details are shown only to eligible contributors. Contributors must not copy or share confidential product details.</p>
<h3>Security and your rights</h3><p>Data is encrypted in transit and access is restricted. You can access, correct or delete your data, or withdraw from the platform, at any time by contacting support.</p>
<h3>Contact</h3><p>privacy@loopback.example</p></div>`,
contributor:()=>{const T={new:'New tasks',saved:'Saved',doing:'In progress',done:'Submitted'},t=S.cm;
const n=k=>k=='new'?S.c.filter(c=>!c.own&&!S.my[c.id]&&!mine().some(s=>s.cid==c.id)).length:k=='done'?mine().length:Object.values(S.my).filter(x=>x==k).length;
let list=t=='new'?S.c.filter(c=>!c.own&&!S.my[c.id]&&!mine().some(s=>s.cid==c.id)):t=='done'?[]:S.c.filter(c=>S.my[c.id]==t);
const cat=$('#fc')?.value||'',q=($('#fq')?.value||'').toLowerCase(),so=$('#fs')?.value||'';
if(t=='new'){list=list.filter(c=>(!cat||c.cat==cat)&&c.t.toLowerCase().includes(q));if(so=='r')list.sort((a,b)=>b.rw-a.rw);if(so=='t')list.sort((a,b)=>a.min-b.min)}
const cats=[...new Set(S.c.map(c=>c.cat))];
return `<div class="row"><h2>Your tasks</h2><span class="pill ok">Earned: ${inr(earn())}</span></div>
<div class="tabs">${Object.keys(T).map(k=>`<button class="${t==k?'on':''}" onclick="S.cm='${k}';draw()">${T[k]} (${n(k)})</button>`).join('')}</div>
${t=='new'?`<div class="flt"><input id="fq" placeholder="Search tasks" value="${q}" oninput="draw();$('#fq').focus()"><select id="fc" onchange="draw()"><option value="">All categories</option>${cats.map(c=>`<option ${c==cat?'selected':''}>${c}</option>`).join('')}</select><select id="fs" onchange="draw()"><option value="">Sort: newest</option><option value="r" ${so=='r'?'selected':''}>Highest reward</option><option value="t" ${so=='t'?'selected':''}>Shortest time</option></select></div>`:''}

const STOP=new Set('the and for that this with was were are but not you your have has had its from they them then than when what which would could should about into very just also more some any can will our out all one get got too use used using'.split(' '));
const tok=t=>t.toLowerCase().match(/[a-z0-9']{3,}/g)||[],kw=t=>tok(t).filter(w=>!STOP.has(w));
const GEN=['user-friendly','user friendly','overall','great website','seamless','intuitive','highly recommend','enhance the user experience','enhances the user experience','clean design','visually appealing','could be improved','easy to navigate','well-designed','looks good','in conclusion','moreover','furthermore','additionally','streamline','engaging','cohesive','strong foundation'];
const SPEC=/\d|["“”]|button|page|screen|click|loaded|error|signup|sign up|login|menu|form|checkout|pricing|footer|header|email|step|tab|icon/i;
const norm=t=>t.toLowerCase().replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
const jac=(a,b)=>{const x=new Set(a),y=new Set(b);if(x.size<6||y.size<6)return 0;let i=0;x.forEach(v=>y.has(v)&&i++);return i/(x.size+y.size-i)};
const sid=s=>'SUB-'+String(s.id).slice(-5);
function rep(s){if(s.rep)return s.rep;const c=cam(s.cid),Qs=c.q.map(Q),txt=s.a.join(' ').trim(),low=txt.toLowerCase(),w=kw(txt),words=tok(txt).length,per=words/Math.max(1,Qs.length);
const miss=Qs.filter((x,i)=>x.r&&!(s.a[i]||'').trim()).length+(c.fu&&c.fu.length&&!s.fu?1:0);
const ctx=new Set(kw(c.t+' '+c.d+' '+(c.goal||'')+' '+Qs.map(x=>x.q).join(' '))),hits=[...new Set(w)].filter(x=>ctx.has(x)).length,rel=Math.min(100,Math.round(hits/Math.min(6,ctx.size||1)*100));
const spec=s.a.filter(a=>SPEC.test(a)).length,q=Math.min(100,Math.round(Math.min(50,per*3)+spec/Math.max(1,Qs.length)*40+(/because|since|instead|expected|but |however/i.test(txt)?10:0)));
const g=GEN.filter(p=>low.includes(p)).length;let pts=0;if(g>=3)pts+=2;else if(g>=1)pts+=1;if(!spec&&words>25)pts++;if((txt.match(/ — /g)||[]).length>1)pts++;
const ai=pts>=3?'High':pts==2?'Medium':'Low';
const others=S.s.filter(o=>o.id!=s.id&&o.a&&!o.arch),dup=[];
others.forEach(o=>{const ot=o.a.join(' ').trim();if(txt&&norm(ot)==norm(txt))dup.push({id:o.id,t:'Exact'});else{const j=jac(w,kw(ot));if(j>=.7)dup.push({id:o.id,t:'Similar',p:Math.round(j*100)})}});
const flags=[];let risk=0;
dup.forEach(d=>{flags.push(d.t+' duplicate of '+sid(d)+(d.p?' ('+d.p+'% overlap)':''));risk+=d.t=='Exact'?50:30});
if(ai!='Low'){flags.push('Possible AI-assisted wording ('+ai.toLowerCase()+' indicators). Not proof; check manually');risk+=ai=='High'?20:10}
if(g>=3){flags.push('Many generic phrases ('+g+')');risk+=15}
if(rel<30){flags.push('Low relevance to the campaign');risk+=20}
if(per<4){flags.push('Very short answers');risk+=15}
if(miss){flags.push(miss+' required item(s) missing');risk+=20}
if(c.trk&&!(s.ev&&s.ev.length)){flags.push('No interaction evidence (contributor may not have consented)');risk+=10}
if(s.fu&&words&&kw(s.fu.a).length<4){flags.push('Follow-up answer is vague');risk+=10}
risk=Math.min(100,risk);const lvl=risk>=60?'High':risk>=30?'Medium':'Low';
const sum='Rule-based report (no AI model connected). Relevance '+rel+'%, quality '+q+'%, '+flags.length+' flag(s). '+(lvl=='High'?'Suggest a close manual check.':lvl=='Medium'?'Worth a second look.':'No major concerns found.');
return s.rep={rel,q,miss,dup,g,ai,flags,risk,lvl,sum,mode:'rules',at:now()}}

function trust(n){const a=S.s.filter(s=>s.who==n),ap=a.filter(s=>s.st=='Approved').length,rj=a.filter(s=>s.st=='Rejected').length,d=ap+rj;if(d<3)return{n:null,txt:'New',lbl:'New contributor'};

<div class="card stack"><h3>3. Questions and instructions</h3>${ft('st','Testing instructions (one step per line)','Open the link&#10;Sign up&#10;Explore for 5 minutes')}${fi('lk','Link to test (optional)','https://')}${ft('fu','Follow-up check questions (optional, one per line)','','One is picked at random to confirm contributors really tried your product.')}<label>Questions *</label>${S.qs.map((x,i)=>`<div class="card stack" style="padding:14px"><input placeholder="Question ${i+1}" value="${E(x.q)}" oninput="S.qs[${i}].q=this.value"><input placeholder="Hint for the contributor (optional)" value="${E(x.h)}" oninput="S.qs[${i}].h=this.value"><div class="row" style="flex-wrap:nowrap"><select onchange="S.qs[${i}].t=this.value"><option value="text" ${x.t=='text'?'selected':''}>Written answer</option><option value="rating" ${x.t=='rating'?'selected':''}>Rating 1–5</option><option value="yesno" ${x.t=='yesno'?'selected':''}>Yes / No / Not sure</option></select><label style="margin:0;white-space:nowrap;font-weight:400"><input type="checkbox" style="width:auto" ${x.r?'checked':''} onchange="S.qs[${i}].r=this.checked?1:0"> Required</label><button class="btn g sm" onclick="rq2(${i})">✕</button></div></div>`).join('')}<button class="btn g sm" onclick="aq()">+ Add a question</button></div>
<div class="card stack"><h3>4. Requirements</h3><div class="grid g2">${fi('n','Responses required *','10','You decide. Nothing is assumed.')}<div><label>Deadline *</label><div class="hint">Must be in the future.</div><input type="date" min="${today()}" value="${f.dl||''}" oninput="S.f.dl=this.value"></div></div></div>
<div class="card stack"><h3>5. Target contributors</h3><p class="mu">Leave a filter empty to include everyone.</p><div><label>Age group</label>${['18–24','25–34','35–44','45+'].map(a=>`<label class="chk"><input type="checkbox" style="width:auto" ${f.age.includes(a)?'checked':''} onchange="tgl('${a}')"> ${a}</label>`).join('')}</div><div class="grid g2">${fi('loc','Location','e.g. Hyderabad, Mumbai')}<div><label>Gender (optional)</label><select onchange="S.f.gender=this.value">${[['','Any'],['Female','Female'],['Male','Male'],['Other','Other']].map(o=>`<option value="${o[0]}" ${f.gender==o[0]?'selected':''}>${o[1]}</option>`).join('')}</select></div>${fi('prof','Profession','e.g. Teacher, Developer')}${fi('ind','Industry','e.g. Education')}${fi('int','Interests','e.g. fitness, travel')}${fi('exp','Relevant experience','e.g. Android user')}</div></div>
<button class="btn" onclick="toPay()">Continue to payment</button></div>`};
function toPay(){const f=S.f,q=S.qs.filter(x=>x.q.trim()),n=+f.n;let e='';
if(!(f.t||'').trim())e='Add a campaign title.';else if((f.d||'').trim().length<20)e='Describe the campaign in at least 20 characters.';else if(!q.length)e='Add at least one question.';else if(!(Number.isInteger(n)&&n>=1))e='Enter how many responses you need (a whole number, at least 1).';else if(!f.dl||f.dl<=today())e='Choose a deadline in the future.';else if(f.type=='interview'&&!(+f.r>=S.rates.imin&&+f.r<=S.rates.imax))e='Interview reward must be between '+inr(S.rates.imin)+' and '+inr(S.rates.imax)+'.';
if(e){S.err=e;draw();scrollTo(0,0);return}
const g=k=>E((f[k]||'').trim()),st=(f.st||'').split('\n').map(x=>E(x.trim())).filter(Boolean);
S.dr={t:g('t'),d:g('d'),type:f.type,n,dl:f.dl,rw:f.type=='interview'?+f.r:S.rates[f.type],cm:S.comm/100,q:q.map(x=>({...x,q:E(x.q.trim()),h:E(x.h.trim())})),steps:st.length?st:0,link:(f.lk||'').startsWith('http')?E(f.lk.trim()):'',fu:(f.fu||'').split('\n').map(x=>E(x.trim())).filter(Boolean),tg:{age:f.age.slice(),gender:f.gender||'',loc:g('loc'),prof:g('prof'),ind:g('ind'),int:g('int'),exp:g('exp')}};S.err='';go('pay')}
V.pay=()=>{const d=S.dr;if(!d)return V.nf();const pool=d.rw*d.n,tot=pool/(1-d.cm),fee=tot-pool,sh=Math.max(0,tot-S.fw.avail),r=(a,b,x)=>`<tr><td>${a}</td><td style="text-align:right">${x?'<b>'+b+'</b>':b}</td></tr>`;
return `<span class="back" onclick="go('create')">← Edit campaign</span><div class="eyebrow">Step 2 of 2</div><h2>Payment summary</h2>${eb()}<div class="err" style="background:var(--wnb);color:var(--wn);margin:12px 0">Payments are simulated in this prototype. No real money moves.</div><div class="grid g2" style="align-items:start"><div class="card stack"><h3>${d.t}</h3><table>${r('Feedback type',TY[d.type])}${r('Responses requested',d.n)}${r('Reward per approved response',inr2(d.rw))}${r('Total contributor rewards',inr2(pool))}${r('Platform commission ('+Math.round(d.cm*100)+'%)',inr2(fee))}${r('Total campaign budget',inr2(tot),1)}</table><p class="ex">The budget is reserved when you pay and used only as responses are approved. Unused funds are returned when the campaign ends.</p></div>
<div class="card stack"><h3>Your wallet</h3><table>${r('Current balance',inr2(S.fw.avail))}${r('Additional amount required',inr2(sh),1)}</table>${sh>0?`<div><label>Amount to add (₹100 to ₹10,000)</label><input id="ta" type="number" value="${Math.max(100,Math.ceil(sh))}"></div><button class="btn" onclick="payGo()">Add money & launch campaign</button>`:`<button class="btn" onclick="payGo()">Pay ${inr2(tot)} from wallet & launch</button>`}<p class="ex">The campaign goes live only after the full budget is secured.</p></div></div>`};
function payGo(){const d=S.dr;if(!d)return;const tot=d.rw*d.n/(1-d.cm),sh=Math.max(0,tot-S.fw.avail);
if(sh>0){const a=+$('#ta').value,e=chkTop(a);if(e){S.err=e;draw();return}if(S.fw.avail+a<tot-1e-9){S.err='Add at least '+inr2(sh)+' to cover the budget.';draw();return}topup(a)}
S.fw.avail-=tot;S.fw.reserved+=tot;S.fw.tx.unshift({t:now(),n:'Budget reserved · '+d.t,amt:-tot,k:'reserved'});
S.c.push({id:Date.now(),own:1,t:d.t,cat:TY[d.type],type:d.type,d:d.d,goal:'',steps:d.steps,link:d.link,q:d.q,fu:d.fu,trk:d.type=='website',rw:d.rw,min:MIN[d.type],need:d.n,dl:d.dl,tg:d.tg,aud:'',st:'Live',cm:d.cm,bud:tot,res:tot,rs:1});const c=S.c[S.c.length-1];c.aud=elig(c);
S.dr=null;S.f=fresh();S.qs=[{q:'',h:'',t:'text',r:1}];S.err='';toast('Campaign is live. Budget reserved (simulated).');go('founder')}
/* founder wallet + dashboard */
V.fwallet=()=>{const w=S.fw;return `<div class="eyebrow">Wallet</div><h2>Founder wallet</h2><div class="err" style="background:var(--wnb);color:var(--wn);margin:12px 0">Payments, refunds and withdrawals are simulated. No real money moves.</div><div class="grid g3"><div class="card stat"><b>${inr2(w.avail)}</b><span>Available</span></div><div class="card stat"><b>${inr2(w.reserved)}</b><span>Reserved for live campaigns</span></div><div class="card stat"><b>${inr2(w.spent)}</b><span>Spent on approved responses</span></div></div>
<div class="grid g2" style="margin:16px 0;align-items:start"><div class="card stack"><h3>Add money</h3><div><label>Amount (₹100 to ₹10,000)</label><input id="fa" type="number" placeholder="500"></div><div class="fe" id="fae"></div><button class="btn" onclick="addM()">Add money (simulated)</button></div><div class="card stack"><h3>Withdraw unused funds</h3><div><label>Amount</label><input id="fx" type="number"></div><div class="fe" id="fxe"></div><button class="btn g" onclick="wdF()">Withdraw (simulated)</button><p class="ex">Refund policy: only available funds can be withdrawn. Reserved funds stay with a live campaign until responses are approved or it ends, and the unused part is then released to your wallet.</p></div></div>
<div class="card tw"><h3 style="margin-bottom:8px">Transaction history</h3><table><tr><th>Date</th><th>Description</th><th>Amount</th></tr>${w.tx.map(t=>`<tr><td>${t.t}</td><td>${t.n}</td><td>${t.amt>0?'+':''}${inr2(t.amt)}</td></tr>`).join('')}</table></div>`};
function addM(){const a=+$('#fa').value,e=chkTop(a);if(e){$('#fae').textContent=e;return}topup(a);toast('Added '+inr2(a)+' (simulated).');draw()}
function wdF(){const a=+$('#fx').value;if(!(a>0)){$('#fxe').textContent='Enter an amount.';return}if(a>S.fw.avail+1e-9){$('#fxe').textContent='Only available funds can be withdrawn ('+inr2(S.fw.avail)+').';return}S.fw.avail-=a;S.fw.tx.unshift({t:now(),n:'Withdrawal (simulated)',amt:-a,k:'out'});toast('Simulated withdrawal requested.');draw()}
V.founder=()=>{autoEnd();const m=S.c.filter(c=>c.own),w=S.fw;return `<div class="row"><h2>Founder dashboard</h2><button class="btn" onclick="go('create')">+ New campaign</button></div><div class="grid g4" style="margin:20px 0"><div class="card stat"><b>${m.filter(c=>c.st=='Live').length}</b><span>Live campaigns</span></div><div class="card stat"><b>${m.reduce((n,c)=>n+appr(c.id).length,0)}</b><span>Approved responses</span></div><div class="card stat"><b>${inr2(w.avail)}</b><span>Wallet available</span></div><div class="card stat"><b>${inr2(w.reserved)}</b><span>Reserved for campaigns</span></div></div><div class="card tw"><table><tr><th>Campaign</th><th>Type</th><th>Status</th><th>Progress</th><th>Deadline</th><th></th></tr>${m.map(c=>`<tr><td><b>${c.t}</b></td><td>${c.cat}</td><td><span class="pill ${c.st=='Live'?'ok':''}">${c.st}</span></td><td>${appr(c.id).length}/${c.need} · ${rem(c)} left</td><td>${c.dl}</td><td><button class="btn g sm" onclick="go('campaign',${c.id})">Open</button></td></tr>`).join('')}</table></div>`};
const C2=V.campaign;V.campaign=()=>{const c=cam(S.cur);return C2().replace('<div class="grid g3">',`<div class="row" style="margin:14px 0"><span class="pill ${c.st=='Live'?'ok':''}">${c.st} · ${rem(c)} responses remaining</span>${c.st=='Live'?`<button class="btn g sm" onclick="endC(${c.id})">End campaign</button>`:''}</div><div class="grid g3">`)};
/* contributor: profile + matching tasks */
V.profile=()=>{const p=S.user.pf||{},f=(k,l,ph)=>`<div><label>${l}</label><input id="pf_${k}" value="${E(p[k]||'')}" placeholder="${ph}"></div>`;
return `<div class="eyebrow">Profile</div><h2>Your profile</h2><p class="mu" style="margin:6px 0 16px">Used only to match you with campaigns. Founders never see your contact details.</p>${eb()}<div class="card stack" style="max-width:560px"><div><label>Age group *</label><select id="pf_age"><option value="">Select</option>${['18–24','25–34','35–44','45+'].map(a=>`<option ${p.age==a?'selected':''}>${a}</option>`).join('')}</select></div>${f('loc','Location *','City, state')}<div><label>Gender (optional)</label><select id="pf_gender">${['','Female','Male','Other'].map(a=>`<option value="${a}" ${p.gender==a?'selected':''}>${a||'Prefer not to say'}</option>`).join('')}</select></div>${f('prof','Profession','e.g. Designer')}${f('ind','Industry','e.g. Education')}${f('int','Interests','e.g. fitness, travel')}${f('exp','Relevant experience','e.g. Android user, small-business owner')}<button class="btn" onclick="svP()">Save profile</button></div>`};
function svP(){const g=k=>$('#pf_'+k).value.trim();if(!g('age')||!g('loc')){S.err='Age group and location are required.';return draw()}S.user.pf={age:g('age'),loc:E(g('loc')),gender:g('gender'),prof:E(g('prof')),ind:E(g('ind')),int:E(g('int')),exp:E(g('exp'))};toast('Profile saved.');go('contributor')}
V.contributor=()=>{const t=S.cm,T={new:'Available',saved:'Saved',doing:'In progress',done:'Submitted'},pr=S.user.pf||{},open=c=>!S.my[c.id]&&!mine().some(s=>s.cid==c.id),live=c=>c.st=='Live'&&rem(c)>0,av=S.c.filter(c=>live(c)&&open(c)),ok=av.filter(c=>match(c,pr)),
cnt=k=>k=='new'?ok.length:k=='done'?mine().length:Object.values(S.my).filter(x=>x==k).length;let L=t=='new'?ok:S.c.filter(c=>S.my[c.id]==t);
const ty=($('#fc')||{}).value||'',q=(($('#fq')||{}).value||'').toLowerCase(),so=($('#fs')||{}).value||'';if(t=='new'){L=L.filter(c=>(!ty||c.type==ty)&&c.t.toLowerCase().includes(q));if(so=='r')L.sort((a,b)=>b.rw-a.rw);if(so=='t')L.sort((a,b)=>a.min-b.min)}
return `<div class="row"><h2>Your tasks</h2><span class="pill ok">Earned: ${inr2(earn())}</span></div>${TC(trust(S.me))}${!pr.age?`<div class="err" style="background:var(--wnb);color:var(--wn);margin-bottom:14px">Complete your profile to see campaigns that match you. <a ${lnk} onclick="go('profile')">Open profile</a></div>`:''}<div class="tabs">${Object.keys(T).map(k=>`<button class="${t==k?'on':''}" onclick="S.cm='${k}';draw()">${T[k]} (${cnt(k)})</button>`).join('')}</div>
${t=='new'?`<div class="flt"><input id="fq" placeholder="Search tasks" value="${E(q)}" oninput="draw();$('#fq').focus()"><select id="fc" onchange="draw()"><option value="">All feedback types</option>${Object.keys(TY).map(k=>`<option value="${k}" ${ty==k?'selected':''}>${TY[k]}</option>`).join('')}</select><select id="fs" onchange="draw()"><option value="">Sort: newest</option><option value="r" ${so=='r'?'selected':''}>Highest reward</option><option value="t" ${so=='t'?'selected':''}>Shortest time</option></select></div>`:''}
${t=='done'?myList():`<div class="grid g3">${L.map(c=>`<div class="card stack"><div class="row"><span class="pill">${c.cat}</span><b style="font-size:1.15rem">${inr2(c.rw)}</b></div><h3>${c.t}</h3><p class="mu">${c.d}</p><div class="ex">⏱ About ${c.min} min<br>Suitable for: ${elig(c)}<br>${rem(c)} responses remaining</div><div class="row"><span class="ex">You earn ${inr2(c.rw)} when approved</span><button class="btn sm" onclick="go('task',${c.id})">View task</button></div></div>`).join('')||'<p class="mu">Nothing here right now.</p>'}</div>${t=='new'&&av.length>ok.length?`<p class="ex" style="margin-top:14px">${av.length-ok.length} more campaign(s) need a different profile and are hidden.</p>`:''}`}`};
/* admin: appeals + rates */
const APL=()=>{const a=S.s.filter(s=>s.ap&&s.ap.st=='Pending');return a.map(s=>`<div class="card stack" style="margin-bottom:14px"><div class="row"><b>${cam(s.cid).t}</b><span class="ex">${sid(s)} · ${E(s.who)}</span></div><p class="ex">Rejected because: ${s.reason}</p><div class="fb"><div class="ex">Contributor’s appeal</div><p>${s.ap.msg}</p></div><div class="row" style="justify-content:flex-start"><button class="btn k sm" onclick="apd(${s.id},1)">Overturn & approve</button><button class="btn r sm" onclick="apd(${s.id},0)">Uphold rejection</button></div></div>`).join('')||'<div class="card"><p class="mu">No appeals waiting.</p></div>'};
const RATES=()=>{const R=S.rates,i=(k,l,v)=>`<div><label>${l}</label><input id="r_${k}" type="number" value="${v}"></div>`;return `<div class="card stack"><h3>Reward rates and commission</h3><p class="mu">Applies to new campaigns only. Running campaigns keep the rate they started with.</p><div class="grid g3">${i('short','Short survey (₹)',R.short)}${i('detailed','Detailed survey (₹)',R.detailed)}${i('website','Website testing (₹)',R.website)}${i('app','App testing (₹)',R.app)}${i('imin','Interview min (₹)',R.imin)}${i('imax','Interview max (₹)',R.imax)}${i('cm','Platform commission (% of budget)',S.comm)}</div><div class="fe" id="rte"></div><button class="btn" onclick="saveR()">Save</button><p class="ex">Commission earned so far: ${inr2(S.rev.reduce((n,x)=>n+x.amt,0))} · Budgets currently reserved: ${inr2(S.c.reduce((n,c)=>n+(c.res||0),0))}</p></div>`};
function saveR(){if(!S.user||S.user.r!='a')return;const v=k=>+$('#r_'+k).value,k=['short','detailed','website','app','imin','imax'],bad=k.some(x=>!(v(x)>0))||v('imin')>v('imax')||!(v('cm')>=0&&v('cm')<=60);if(bad){$('#rte').textContent='Enter positive amounts, interview min no higher than max, and commission between 0 and 60.';return}k.forEach(x=>S.rates[x]=v(x));S.comm=v('cm');toast('Rates saved for new campaigns.');draw()}

onhashchange=()=>{const v=location.hash.slice(1);if(v&&v!=S.view)go(v)};
{const h=location.hash.slice(1);if(['privacy','login','signup'].includes(h))setTimeout(()=>go(h));else location.hash='home'}

draw();
</script></body></html>
